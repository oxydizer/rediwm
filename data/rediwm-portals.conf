[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
# The compositor answers color-scheme ([compositor] dark_mode); gtk keeps
# every other setting. xdg-desktop-portal uses the first backend with a key.
org.freedesktop.impl.portal.Settings=rediwm;gtk
org.freedesktop.impl.portal.FileChooser=rediwm;gtk
