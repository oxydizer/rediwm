# Default xdg-desktop-portal-wlr config for RediWM. The compositor copies this
# to $XDG_CONFIG_HOME/xdg-desktop-portal-wlr/rediwm on a real login if that
# file does not already exist — never overwriting a user override.
# xdpw itself does not read from the datadir; see xdg-desktop-portal-wlr(5).
[screencast]
max_fps=30
chooser_type=dmenu
chooser_cmd=rediwm-share-picker --xdpw-dmenu
