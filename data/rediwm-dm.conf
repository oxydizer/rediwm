# /etc/rediwm/dm.conf - configuration for rediwm-dm

# Virtual terminal number to use (default: 1)
# vt = 1

# User account under which to run the greeter process (default: rediwm-greeter).
# /etc/pam.d/rediwm-greeter admits only this account without a password;
# change its pam_succeed_if line to match.
# greeter_user = rediwm-greeter

# Command to execute for the greeter UI (default: /usr/local/bin/rediwm --greeter)
# greeter_command = /usr/local/bin/rediwm --greeter

# Optional autologin configuration:
# When set, rediwm-dm logs this user into the specified session automatically once on boot.
# If the session crashes within 10 seconds of startup, or when the user logs out,
# rediwm-dm returns to the normal greeter screen.
# autologin_user = alice
# autologin_session = rediwm
