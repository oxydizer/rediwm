[meta]
format = 1
id = "redi-blue"
name = "Redi Blue"

[theme]
# Shared lock screen and login screen.
lock_bg = "#101923"
lock_fg = "#DCE6EE"
lock_dim = "#A6B9C8"
lock_divider = "#2E4456"
lock_session_fg = "#88B5D6"
lock_wallpaper_opacity = 0.24

# Window chrome
window_bg = "rgba(13,25,36,0.82)"
window_fg = "#DCE6EE"
window_dim = "#A6B9C8"
window_border = "#2E4456"
window_border_hover = "rgba(63,128,179,0.70)"
window_divider = "#253949"
window_close_hover = "#ED1B2E"

# App windows (Files, Images, PDF)
text_secondary = "#A6B9C8"
app_bg = "#101C26"
app_toolbar = "#132434"
app_sidebar = "#142737"
app_bar = "#1B3041"
app_item = "#192A38"
app_item_hover = "#1E374C"
app_item_border = "#253949"
app_item_selected = "#20486A"
app_nav_selected = "#1B4566"
app_divider = "#253949"
app_icon = "#88B5D6"
scrollbar_thumb = "#4E6D83"
scrollbar_thumb_active = "#5199D9"

# Shell palette
bg = "#101923"
fg = "#DCE6EE"
dim = "#A6B9C8"
faint = "#899FB0"
accent = "#5199D9"
accent_2 = "#83AAC4"
accent_3 = "#4285BF"
danger = "#E68E97"
on_accent = "#0C1924"
# Shell controls use these overrides when constructing their palette.
shell_accent = "#5199D9"
shell_on_accent = "#0C1924"
shell_border_focus = "#5199D9"
surface = "rgba(255,255,255,0.05)"
surface_hover = "rgba(81,153,217,0.12)"
border = "#2E4456"
border_soft = "#253949"
border_hover = "#3F80B3"
border_focus = "rgba(81,153,217,0.75)"
glass = "rgba(16,28,38,0.62)"
glass_strong = "rgba(13,25,36,0.82)"
shadow = "rgba(0,0,0,0.55)"
border_glow = "rgba(81,153,217,0.12)"

# Taskbar
taskbar_bg = "rgba(16,28,38,0.96)"
taskbar_surface = "rgba(255,255,255,0.03)"
taskbar_hover = "rgba(81,153,217,0.12)"
taskbar_border = "#2E4456"

# Start menu and fields
start_menu_bg = "rgba(19,36,52,0.98)"
start_menu_border = "#2E4456"
start_menu_search_bg = "#0E1B26"
start_menu_selected_bg = "rgba(81,153,217,0.18)"
start_menu_selected_border = "rgba(81,153,217,0.45)"
start_menu_selected_marker = "#5199D9"
field_bg = "#0E1B26"
field_border = "#4E6D83"

# Caret, selection tint and focused field borders follow the accent.
selection_alpha = 0.30

# Line thicknesses and sizes (logical px)
caret_width = 1.5
scrollbar_width = 8
chrome_height = 32
chrome_control_gap = 4
taskbar_size = 44
start_button_icon_size = 36
chip_gap = 4
shadow_size = 24
shadow_offset_y = 8

# Sharp corners
radius = 4
radius_md = 4
radius_lg = 4
field_radius = 4
start_menu_radius = 4
settings_radius = 4
settings_sidebar_radius = 4
settings_card_radius = 4
toggle_radius = 4
swatch_radius = 4
dialog_badge_radius = 4
dialog_inset_radius = 4
switcher_radius = 4
switcher_item_radius = 4
switcher_icon_radius = 4
switcher_selection_radius = 4
calendar_radius = 4
osd_radius = 4
start_button_radius = 4

[layout]
taskbar_position = "bottom"
taskbar_items = ["left:start", "left:windows", "right:capture", "right:tray", "right:battery", "~right:wifi", "~right:wired", "right:volume", "right:clock", "-right:power"]
dock_enabled = false

[assets]
color_scheme = "dark"
wallpaper = "wallpaper-blue.png"
