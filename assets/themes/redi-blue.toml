[meta]
format = 1
id = "redi-blue"
name = "Redi Blue"

[theme]
# Shared lock screen and login screen.
lock_bg = "#171D28"
lock_fg = "#DBE0E8"
lock_dim = "#B3BECD"
lock_divider = "#47566B"
lock_session_fg = "#A5B9D2"
lock_wallpaper_opacity = 0.24

# Window chrome
window_bg = "rgba(24,30,41,0.82)"
window_fg = "#DBE0E8"
window_dim = "#B3BECD"
window_border = "#47566B"
window_border_hover = "rgba(146,169,200,0.70)"
window_divider = "#354152"
window_close_hover = "#ED1B2E"

# App windows (Files, Images, PDF)
text_secondary = "#B3BECD"
app_bg = "#1B222E"
app_toolbar = "#202835"
app_sidebar = "#232C3A"
app_bar = "#273241"
app_item = "#283343"
app_item_hover = "#333F51"
app_item_border = "#354152"
app_item_selected = "#394D68"
app_nav_selected = "#354961"
app_divider = "#354152"
app_icon = "#A5B9D2"
scrollbar_thumb = "#65768C"
scrollbar_thumb_active = "#92A9C8"

# Shell palette
bg = "#171D28"
fg = "#DBE0E8"
dim = "#B3BECD"
faint = "#94A2B6"
accent = "#92A9C8"
accent_2 = "#BAA3B5"
accent_3 = "#8299B9"
danger = "#E68E97"
on_accent = "#17202D"
# Shell controls use these overrides when constructing their palette.
shell_accent = "#92A9C8"
shell_on_accent = "#17202D"
surface = "rgba(255,255,255,0.05)"
surface_hover = "rgba(146,169,200,0.12)"
border = "#47566B"
border_soft = "#354152"
border_hover = "#748CA9"
border_focus = "rgba(146,169,200,0.70)"
glass = "rgba(27,34,46,0.62)"
glass_strong = "rgba(24,30,41,0.82)"
shadow = "rgba(0,0,0,0.55)"
border_glow = "rgba(146,169,200,0.32)"

# Taskbar
taskbar_bg = "rgba(27,34,46,0.96)"
taskbar_surface = "rgba(255,255,255,0.03)"
taskbar_hover = "rgba(146,169,200,0.12)"
taskbar_border = "#47566B"

# Start menu and fields
start_menu_bg = "rgba(32,40,53,0.98)"
start_menu_border = "#47566B"
start_menu_search_bg = "#191F2A"
start_menu_selected_bg = "rgba(146,169,200,0.18)"
start_menu_selected_border = "rgba(146,169,200,0.45)"
start_menu_selected_marker = "#92A9C8"
field_bg = "#191F2A"
field_border = "#62738A"

# Caret, selection tint and focused field borders follow the accent.
selection_alpha = 0.30

# Line thicknesses and sizes (logical px)
caret_width = 1.5
scrollbar_width = 8
chrome_height = 32
chrome_control_gap = 4
taskbar_size = 44
start_button_icon_size = 36
chip_gap = 4
shadow_size = 24
shadow_offset_y = 8

# Sharp corners
radius = 4
radius_md = 4
radius_lg = 4
field_radius = 4
start_menu_radius = 4
settings_radius = 4
settings_sidebar_radius = 4
settings_card_radius = 4
toggle_radius = 4
swatch_radius = 4
dialog_badge_radius = 4
dialog_inset_radius = 4
switcher_radius = 4
switcher_item_radius = 4
switcher_icon_radius = 4
switcher_selection_radius = 4
calendar_radius = 4
osd_radius = 4
start_button_radius = 4

[layout]
taskbar_position = "bottom"
taskbar_items = ["left:start", "left:windows", "right:capture", "right:tray", "right:battery", "~right:wifi", "~right:wired", "right:volume", "right:clock", "-right:power"]
dock_enabled = false

[assets]
color_scheme = "dark"
wallpaper = "wallpaper-blue.png"
